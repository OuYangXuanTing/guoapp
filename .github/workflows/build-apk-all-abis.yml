# 构建全架构 APK（真果鉴 / --all-sources）
#
# 用途：在 GitHub Actions 上把 guoapp 打包成 Android APK，固定使用 --all-sources
#       （真果鉴 / 全站源版）。每个 ABI 单独跑一次独立构建（matrix），互不干扰：
#         - arm64-v8a  （绝大多数 64 位手机）
#         - armeabi-v7a（较老的 32 位手机）
#         - x86_64     （模拟器）
#
# 触发方式：
#   1. 手动：仓库 → Actions → “Build APK (all ABIs / --all-sources)” → Run workflow
#   2. 自动：推送 main 分支或 v* 标签时自动触发
#
# 产物：Actions 运行详情页的 Artifacts（每个 ABI 一个，dist/android 下的 *.apk + SHA256SUMS.txt）
#       文件名以 zhenguojian-<abi> 开头
#
# 签名（可选）：在仓库 Settings → Secrets and variables 配置以下 Secrets 后即为正式发布签名；
#       未配置时自动使用 debug 签名（仅供测试，不能与正式版互覆盖安装）：
#       ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#       另可在仓库 Variables 配置 ANDROID_CERT_SHA256 做证书指纹校验。

name: Build APK (all ABIs / --all-sources)

on:
  workflow_dispatch:
    inputs:
      cn_mirrors:
        description: '是否启用国内依赖镜像（Flutter 中国镜像 + 阿里云 Maven）'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Go 模块拉取走国内代理，构建更稳更快（脚本内部默认也是 goproxy.cn,direct）
env:
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: off

jobs:
  android:
    name: Build ${{ matrix.abi }} APK (真果鉴)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 每个 ABI 独立一次构建：arm64-v8a / armeabi-v7a / x86_64
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (版本由 native/go.mod 决定)
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build ${{ matrix.abi }} APK (真果鉴 / --all-sources)
        shell: bash
        run: |
          MIRROR_FLAG=""
          if [ "${{ github.event.inputs.cn_mirrors }}" = "true" ]; then
            MIRROR_FLAG="--cn-mirrors"
          fi
          python scripts/build_android.py --all-sources --abi ${{ matrix.abi }} $MIRROR_FLAG

      - name: 校验 APK 签名证书
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。" >&2
            exit 0
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done

      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean

      - name: Upload ${{ matrix.abi }} APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-${{ matrix.abi }}
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
